# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.13.1"
  python_check_max: "3.14"
  uv_dynamic_versioning_min: "0.14.1"
  pip_install: -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

recipe:
  name: httpx2-split
  version: ${{ version }}

source:
  - target_directory: httpcore2
    url: https://pypi.org/packages/source/h/httpcore2/httpcore2-${{ version }}.tar.gz
    sha256: e0aa977abe17e69a3b820a24542a6fa88702676d83880b8d194dcd18408e5103
  - target_directory: httpx2
    url: https://pypi.org/packages/source/h/httpx2/httpx2-${{ version }}.tar.gz
    sha256: e48744a19e3af5ee48313d0ce5fe941d5422fae5705ea922a4aabf94d7800dfa

build:
  noarch: python
  number: 0

outputs:
  - package:
      name: httpcore2
      version: ${{ version }}
    build:
      noarch: python
      script:
        - cd httpcore2
        - ${{ PYTHON }} ${{ pip_install }}
    requirements:
      host:
        - hatch-fancy-pypi-readme
        - hatchling
        - pip
        - python ${{ python_min }}.*
        - uv-dynamic-versioning >=${{ uv_dynamic_versioning_min }}
      run:
        - h11 >=0.16
        - python >=${{ python_min }}
        - truststore >=0.10
      run_constraints:
        - anyio >=4.5.0,<5.0
        - h2 >=3,<5
        - socksio 1.*
        - trio >=0.34.0,<1.0
    tests:
      - package_contents:
          strict: true
          site_packages:
            - httpcore2/**
            - httpcore2-${{ version }}.dist-info/**
      - python:
          imports: httpcore2
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      homepage: https://pypi.org/project/httpcore2
      summary: A minimal low-level HTTP client.
      license_file: httpcore2/LICENSE.md

  - package:
      name: httpx2
    build:
      script:
        - cd httpx2
        - ${{ PYTHON }} ${{ pip_install }}
      python:
        entry_points:
          - httpx2 = httpx2:main
    requirements:
      host:
        - hatch-fancy-pypi-readme
        - hatchling
        - pip
        - python ${{ python_min }}.*
        - uv-dynamic-versioning >=${{ uv_dynamic_versioning_min }}
      run:
        - ${{ pin_subpackage("httpcore2", exact=True) }}
        - anyio >=4.10
        - idna >=3.18
        - python >=${{ python_min }}
        - truststore >=0.10
        - typing_extensions >=4.5.0
      run_constraints:
        - backports.zstd >=1.0.0
        - click >=8.4.2
        - h2 >=3,<5
        - pygments 2.*
        - rich >=10,<16
        - socksio 1.*
        - wsproto >=1.2
    tests:
      - package_contents:
          strict: true
          site_packages:
            - httpx2/**
            - httpx2-${{ version }}.dist-info/**
      - python:
          imports: httpx2
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - requirements:
          run:
            - click
            - pygments
            - python ${{ python_min }}.*
            - rich
        script:
          env:
            PYTHONIOENCODING: utf-8
            PYTHONUTF8: "1"
          content:
            - httpx2 --help

about:
  homepage: https://pypi.org/project/httpx2
  summary: The next generation HTTP client.
  license: BSD-3-Clause
  repository: https://github.com/pydantic/httpx2
  license_file: httpx2/LICENSE.md

extra:
  feedstock-name: httpx2
  recipe-maintainers:
    - bollwyvl
    - Kludex
